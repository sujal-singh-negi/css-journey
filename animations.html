<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <style>
        .container{
            width: 100vw;
            height: 100vh;
            background: aqua

        }
        .box{
            width: 300px;
            height: 300px;
            background: red;
            /* animation-name: widthAnimate;
            animation-duration: 3s;
            animation-timing-function: ease-in-out;
            animation-delay: 1s;
            animation-iteration-count: 5;
            animation-direction:  alternate-reverse; */
            animation: widthAnimate 3s ease-in-out 1s 5 alternate;

        }
        @keyframes widthAnimate {
            from{
                width:300px;
                height:300px
            }
            to{
                width: 400px;
                height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"><img src="edited_image.png" alt="" width= "460px" height="490px"></div>
    </div>
</body>
</html>
