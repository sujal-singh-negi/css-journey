<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Collapse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            ;
        }

        .box1 {
            background-color: brown;
            margin: 20px;
            height: 2000px;
            width: 233px;
        }

        .box2 {
            background-color: aqua;
            margin: 20px;
            height: 40px;
            width: 100%;
            padding: 10px;
            border: 5px red solid;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="box1">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quam soluta quaerat veritatis eos et quisquam. Iusto
        officiis velit hic. Laudantium esse earum eum neque enim cupiditate veritatis, doloremque eligendi magnam
        voluptas veniam sunt. Sit.
    </div>
    
</body>

</html>
